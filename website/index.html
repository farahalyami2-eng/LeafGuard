<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LeafGuard — Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Cabinet+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="auth.css">
  <script src="i18n.js"></script>
</head>
<body>

  <div class="cursor-dot"  id="cursorDot"></div>
  <div class="cursor-ring" id="cursorRing"></div>

  <div class="auth-grain"></div>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <div class="auth-page">
    <div class="lang-switcher auth-lang-switcher">
      <button class="lang-btn" data-lang="en"  onclick="setLanguage('en')">EN</button>
      <button class="lang-btn" data-lang="zh"  onclick="setLanguage('zh')">中文</button>
      <button class="lang-btn" data-lang="ar"  onclick="setLanguage('ar')">عربي</button>
    </div>
    <div class="auth-brand">
      <div class="auth-logo">
        <img src="logo.png" alt="LeafGuard" class="auth-logo-img">
      </div>
      <p class="auth-tagline" data-i18n="auth_tagline">AI-Powered Agricultural Intelligence</p>
    </div>

    <div class="auth-card">
      <div class="auth-tabs">
        <button class="auth-tab active" id="tabSignIn" onclick="switchTab('signin')" data-i18n="auth_signin">Sign In</button>
        <button class="auth-tab"        id="tabSignUp" onclick="switchTab('signup')" data-i18n="auth_signup">Create Account</button>
      </div>

      <!-- Sign In -->
      <form class="auth-form" id="formSignIn" onsubmit="handleSignIn(event)">
        <div class="form-group">
          <label class="form-label" data-i18n="auth_email">Email</label>
          <div class="input-wrap">
            <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
            <input type="email" class="form-input" id="siEmail" placeholder="you@example.com" data-i18n-ph="auth_email_ph" required autocomplete="email">
          </div>
        </div>
        <div class="form-group">
          <label class="form-label" data-i18n="auth_password">Password</label>
          <div class="input-wrap">
            <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
            <input type="password" class="form-input" id="siPassword" placeholder="••••••••" data-i18n-ph="auth_pass_ph" required autocomplete="current-password">
          </div>
        </div>
        <div class="form-error" id="siError"></div>
        <button type="submit" class="form-submit" id="siBtn">
          <span data-i18n="auth_signin">Sign In</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </button>
      </form>

      <!-- Sign Up -->
      <form class="auth-form hidden" id="formSignUp" onsubmit="handleSignUp(event)">
        <div class="form-group">
          <label class="form-label" data-i18n="auth_fullname">Full Name</label>
          <div class="input-wrap">
            <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <input type="text" class="form-input" id="suName" placeholder="Your full name" data-i18n-ph="auth_name_ph" required autocomplete="name">
          </div>
        </div>
        <div class="form-group">
          <label class="form-label" data-i18n="auth_email">Email</label>
          <div class="input-wrap">
            <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
            <input type="email" class="form-input" id="suEmail" placeholder="you@example.com" data-i18n-ph="auth_email_ph" required autocomplete="email">
          </div>
        </div>
        <div class="form-group">
          <label class="form-label" data-i18n="auth_password">Password</label>
          <div class="input-wrap">
            <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
            <input type="password" class="form-input" id="suPassword" placeholder="Min. 6 characters" data-i18n-ph="auth_pass_min" required minlength="6" autocomplete="new-password">
          </div>
        </div>
        <div class="form-error" id="suError"></div>
        <button type="submit" class="form-submit" id="suBtn">
          <span data-i18n="auth_signup">Create Account</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </button>
      </form>
    </div>

    <p class="auth-footer" data-i18n="auth_footer">LeafGuard &nbsp;&middot;&nbsp; Agricultural Intelligence Platform</p>
  </div>

  <script src="auth.js"></script>
</body>
</html>
